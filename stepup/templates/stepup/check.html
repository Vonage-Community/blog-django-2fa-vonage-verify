{% extends "base.html" %}
{% block title %}Enter your code — Setlist{% endblock %}

{% block content %}
<h2>Enter your code</h2>

<p>We sent a code to <strong>{{ masked_number }}</strong>.</p>

<form method="post">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {{ form.as_div }}
  <div><button type="submit">Verify</button></div>
</form>

<p class="muted">
  Didn't get it? <a href="{% url 'stepup:start' %}?next={{ next|urlencode }}">Send a new code</a>.
</p>
{% endblock %}
