{% extends "base.html" %}
{% block title %}Sign in — Setlist{% endblock %}

{% block content %}
<div class="page-head">
  <p class="eyebrow">Welcome back</p>
  <h1>Sign in</h1>
</div>

<div class="card">
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <div><button type="submit" class="btn">Sign in</button></div>
  </form>

  <div class="callout callout-info" style="margin-top:1.5rem;box-shadow:none;background:var(--gray-1)">
    Demo accounts: <code>ada</code> and <code>grace</code>, password <code>setlist-demo</code>.
  </div>
</div>
{% endblock %}
