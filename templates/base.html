{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Setlist{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Roboto+Mono:wght@300;500&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* Vonage 2024 brand palette. Primary tones lead, grays do the breaking up. */
    :root {
      --purple:   #871FFF;
      --plum:     #3D0049;
      --rasberry: #9E1766;
      --magenta:  #D6219C;
      --cyan:     #80C7F5;
      --orange:   #FA7554;

      --gray-1: #E8EAEE;
      --gray-2: #D9DCE3;
      --gray-3: #C2C4CC;
      --gray-4: #878A91;
      --gray-5: #54575E;
      --white:  #FFFFFF;
      --ink:    #1C1C1C;

      /* Approved 2-tone combos only: purple to cyan, purple to peach. */
      --grad-cyan:  linear-gradient(90deg, var(--purple) 0%, var(--cyan) 100%);
      --grad-peach: linear-gradient(90deg, var(--purple) 0%, #FFA68C 100%);

      --radius: 12px;
      --shadow: 0 1px 2px rgba(28,28,28,.06), 0 8px 24px rgba(61,0,73,.06);

      --font-head: "Montserrat", system-ui, sans-serif;
      --font-body: "Roboto", system-ui, -apple-system, sans-serif;
      --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--gray-1);
      color: var(--ink);
      font: 300 16px/1.6 var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 { font-family: var(--font-head); font-weight: 600; letter-spacing: -.01em; margin: 0; }

    a { color: var(--purple); }

    /* Eyebrow text: all caps, mono, per the brand default typography. */
    .eyebrow {
      font: 500 11px/1 var(--font-mono);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gray-5);
    }

    /* ---------- chrome ---------- */

    .topbar { background: var(--plum); color: var(--white); }
    .topbar-inner {
      max-width: 60rem; margin-inline: auto; padding: 1rem 1.5rem;
      display: flex; align-items: center; gap: 1.25rem;
    }
    .brand {
      font-family: var(--font-head); font-weight: 600; font-size: 1.15rem;
      color: var(--white); text-decoration: none; letter-spacing: -.02em;
      display: flex; align-items: center; gap: .55rem;
    }
    .brand-dot {
      width: 10px; height: 26px; border-radius: 3px; background: var(--grad-cyan);
    }
    .topbar nav { margin-left: auto; display: flex; align-items: center; gap: 1.25rem; }
    .topbar nav a, .topbar nav button {
      color: var(--white); font: 400 .9rem var(--font-body); text-decoration: none;
    }
    .topbar nav a:hover { text-decoration: underline; }

    .gradient-rule { height: 4px; background: var(--grad-cyan); }

    main { max-width: 60rem; margin-inline: auto; padding: 2.5rem 1.5rem 5rem; }

    .page-head { margin-bottom: 1.75rem; }
    .page-head h1 { font-size: 1.75rem; margin-bottom: .35rem; }
    .page-head p { color: var(--gray-5); margin: 0; }

    /* ---------- ticket stubs ---------- */

    .tickets { list-style: none; padding: 0; margin: 0; display: grid; gap: 1rem; }

    .stub {
      background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow);
      display: grid; grid-template-columns: 6px 1fr auto; overflow: hidden;
    }
    .stub-edge { background: var(--grad-cyan); }
    .stub-body { padding: 1.15rem 1.35rem; }
    .stub-body h2 { font-size: 1.1rem; margin-bottom: .2rem; }
    .stub-meta { color: var(--gray-5); font-size: .92rem; }
    .stub-tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .7rem; }
    .tag {
      font: 500 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
      background: var(--gray-1); color: var(--gray-5);
      padding: .4rem .55rem; border-radius: 5px;
    }
    .stub-side {
      border-left: 1px dashed var(--gray-3); padding: 1.15rem 1.35rem;
      display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
      gap: .5rem; min-width: 11rem; text-align: right;
    }
    .value { font-family: var(--font-head); font-weight: 600; font-size: 1.35rem; }
    .value small { display: block; font: 500 10px/1 var(--font-mono);
                   letter-spacing: .1em; text-transform: uppercase; color: var(--gray-4); }

    /* ---------- buttons ---------- */

    .btn {
      display: inline-block; font: 500 .95rem var(--font-body); cursor: pointer;
      padding: .65rem 1.25rem; border-radius: 8px; border: 1px solid transparent;
      background: var(--purple); color: var(--white); text-decoration: none;
    }
    .btn:hover { background: #7318db; }
    .btn-ghost { background: transparent; color: var(--purple); border-color: var(--gray-3); }
    .btn-ghost:hover { background: var(--white); }
    .btn-link {
      background: none; border: none; padding: 0; color: inherit;
      font: 400 .9rem var(--font-body); text-decoration: underline; cursor: pointer;
    }

    /* ---------- cards, forms ---------- */

    .card {
      background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 1.75rem; max-width: 32rem;
    }
    .card + .card { margin-top: 1rem; }
    .card h1 { font-size: 1.4rem; margin-bottom: .5rem; }

    form { display: grid; gap: 1.15rem; }
    label { display: block; font-weight: 500; font-size: .92rem; margin-bottom: .3rem; }
    input[type=text], input[type=password] {
      width: 100%; padding: .7rem .8rem; font: 300 1rem var(--font-body);
      border: 1px solid var(--gray-3); border-radius: 8px; background: var(--white); color: var(--ink);
    }
    input:focus-visible { outline: 2px solid var(--purple); outline-offset: 1px; border-color: var(--purple); }
    .helptext, .form-note { display: block; margin-top: .35rem; color: var(--gray-5); font-size: .85rem; }
    .errorlist { list-style: none; padding: 0; margin: .35rem 0 0; color: var(--rasberry); font-size: .87rem; }

    /* Big, spaced entry for the one-time code. */
    .code-input input {
      font: 500 1.6rem/1 var(--font-mono); letter-spacing: .35em; text-align: center; padding: .9rem;
    }

    /* ---------- callouts ---------- */

    .callout { border-radius: 10px; padding: 1rem 1.15rem; font-size: .93rem; }
    .callout strong { font-weight: 500; }
    .callout-warn { background: #FFF1EC; border-left: 4px solid var(--orange); }
    .callout-verified { background: #F6EDFF; border-left: 4px solid var(--purple); }
    .callout-info { background: var(--white); border-left: 4px solid var(--cyan); box-shadow: var(--shadow); }

    .messages { list-style: none; padding: 0; margin: 0 0 1.5rem; display: grid; gap: .6rem; }
    .messages li {
      padding: .8rem 1rem; border-radius: 8px; background: var(--white);
      border-left: 4px solid var(--cyan); box-shadow: var(--shadow); font-size: .93rem;
    }
    .messages li.error { border-left-color: var(--rasberry); }
    .messages li.success { border-left-color: var(--purple); }

    .powered {
      margin-top: 1.5rem; font: 300 .8rem var(--font-mono); color: var(--gray-4);
      display: flex; align-items: center; gap: .5rem;
    }
    .powered::before { content: ""; width: 18px; height: 3px; border-radius: 2px; background: var(--grad-cyan); }

    .muted { color: var(--gray-5); font-size: .9rem; }

    @media (max-width: 640px) {
      .stub { grid-template-columns: 6px 1fr; }
      .stub-side { border-left: none; border-top: 1px dashed var(--gray-3); align-items: flex-start; text-align: left; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{% url 'tickets:index' %}"><span class="brand-dot"></span>Setlist</a>
      <nav>
        {% if user.is_authenticated %}
          <a href="{% url 'tickets:list' %}">My tickets</a>
          <form action="{% url 'logout' %}" method="post" style="display:inline">
            {% csrf_token %}
            <button type="submit" class="btn-link">Sign out ({{ user.username }})</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}">Sign in</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <div class="gradient-rule"></div>

  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
